name: Verify Simple Convex 8- and 9-Venn (K=8, K=25)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-python:
    name: Exact Integer & Q^2 Python Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (native git)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}" || git fetch --depth 1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Verify n=8 (K=8) exact Z^2 certificate
        run: |
          python3 --version
          python3 verify_z2_certificate.py CERTIFIED_SIMPLE_8_VENN_k8_Z2.json

      - name: Verify n=8 (K=8) independent Q^2 certificate (if present)
        run: |
          if [ -f verify_independent_q2.py ]; then
            python3 verify_independent_q2.py CERTIFIED_SIMPLE_8_VENN_k8_Z2.json
          fi

      - name: Verify n=9 (K=25) exact Z^2 / Q^2 certificate
        run: |
          python3 n9/verify_9venn_q2.py n9/CERTIFIED_SIMPLE_9_VENN_k25_Z2.json

  verify-lean4:
    name: Lean 4 Kernel Proof Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (native git)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}" || git fetch --depth 1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Audit zero sorry / admit / axiom / native_decide (n=8 & n=9)
        run: |
          python3 -c '
          import re, sys
          for fn in ["SimpleConvex8VennK8.lean", "n9/SimpleConvex9VennK25.lean"]:
              s = open(fn, encoding="utf-8").read()
              s = re.sub(r"/-.*?-/", "", s, flags=re.S)
              s = re.sub(r"--.*", "", s)
              m = re.search(r"\b(sorry|admit|native_decide|axiom)\b", s)
              if m:
                  sys.exit(f"Forbidden keyword {m.group(0)!r} detected in {fn}!")
          print("Clean audit: zero sorry, admit, axiom, or native_decide in both Lean files.")
          '

      - name: Install Lean 4 (elan v4.14.0)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Kernel-check SimpleConvex8VennK8.lean
        run: |
          lean --version
          lean SimpleConvex8VennK8.lean
          echo "n=8 Lean 4 kernel verification PASSED (exit 0)!"

      - name: Kernel-check n9/SimpleConvex9VennK25.lean
        run: |
          OUT=$(lean n9/SimpleConvex9VennK25.lean)
          echo "$OUT"
          if echo "$OUT" | grep -Eq 'sorryAx|ofReduceBool|trustCompiler'; then
            echo "Unexpected axiom detected in n9/SimpleConvex9VennK25.lean!"
            exit 1
          fi
          echo "n=9 Lean 4 kernel verification PASSED (exit 0)!"
